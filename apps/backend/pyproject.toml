[project]
name = "agil-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agil-shared",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.15",
  "openai>=1.70",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langfuse>=3.0",
  "pillow>=11",
  "mutagen>=1.47",
  "tiktoken>=0.9",
  "boto3>=1.43.123",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv.sources]
agil-shared = { workspace = true }
