<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · Central de cobranza</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-shell"><main class="login-card"><a class="brand" href="/central"><span class="brand-mark">a.</span> Cobranza <span class="pill">DEMO</span></a><h1>Central de operación</h1><p class="muted">Ingresa con tu credencial privada de operador.</p>{% if error %}<p class="notice danger" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Usuario<input name="username" autocomplete="username" required autofocus maxlength="120"></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button class="primary full">Ingresar a la central <span aria-hidden="true">→</span></button></form><p class="footnote">Acceso privado. Los datos de esta demo son ficticios.</p></main></body></html>
