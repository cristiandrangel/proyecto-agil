[project]
name = "agil-central"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agil-shared", "fastapi>=0.115", "uvicorn>=0.34", "pydantic-settings>=2.8",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.15", "itsdangerous>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/central"]

[tool.uv.sources]
agil-shared = { workspace = true }
