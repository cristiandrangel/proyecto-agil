name: Windows launcher portability

on:
  push:
    paths:
      - emulate-ec2.ps1
      - emulate-ec2.cmd
      - .gitattributes
      - tests/infrastructure/windows-launcher.tests.ps1
      - .github/workflows/portability.yml
  pull_request:
    paths:
      - emulate-ec2.ps1
      - emulate-ec2.cmd
      - .gitattributes
      - tests/infrastructure/windows-launcher.tests.ps1
      - .github/workflows/portability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 paths, arguments and NTFS privacy
        shell: powershell
        run: ./tests/infrastructure/windows-launcher.tests.ps1
      - name: PowerShell 7 paths, arguments and NTFS privacy
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/infrastructure/windows-launcher.tests.ps1
